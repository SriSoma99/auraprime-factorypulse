# AuraPrime FactoryPulse v2 Local Mosquitto Broker Configuration (ADR-026, Spike TO-2)
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Log configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
