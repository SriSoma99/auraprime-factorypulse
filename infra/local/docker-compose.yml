# Local DS-01, DS-02 & Mosquitto messaging infrastructure (ADR-011, ADR-026, Spike TO-2).
# Values come from .env.local, which `pnpm local:init` generates; secrets are never committed.
name: factorypulse-local
services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FP_DB_NAME:?run pnpm local:init}
      POSTGRES_USER: ${FP_DB_ADMIN_USER:?run pnpm local:init}
      POSTGRES_PASSWORD: ${FP_DB_ADMIN_PASSWORD:?run pnpm local:init}
    ports:
      - "127.0.0.1:${FP_DB_PORT:?run pnpm local:init}:5432"
    volumes:
      # timescaledb-ha keeps PGDATA under /home/postgres/pgdata, not /var/lib/postgresql/data.
      - fp-pgdata:/home/postgres/pgdata
    healthcheck:
      # TCP, not the socket: on first boot the temporary init server answers on the socket only, then restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - fp-mosquittodata:/mosquitto/data

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - fp-kafkadata:/tmp/kraft-combined-logs

volumes:
  fp-pgdata:
  fp-mosquittodata:
  fp-kafkadata:
